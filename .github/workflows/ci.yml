name: SystemC CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-simulate:
    name: Build and simulate (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake libsystemc-dev
          if [ "${{ matrix.compiler }}" = "clang++" ]; then
            sudo apt-get install --yes clang
          else
            sudo apt-get install --yes g++
          fi

      - name: Configure
        run: cmake -S . -B build -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}

      - name: Build
        run: cmake --build build --parallel 2

      - name: Run simulation
        run: ./build/tlm_at_four_phase
